# ┌──────────────────────────────────────────────────────────────────────────────────────────────┐
# │ STATUS: LIVE. This pipeline runs on every push and merge request.                            │
# │                                                                                              │
# │ Runner 192 "agentforge-ci" — project-scoped, docker executor, image python:3.12-slim, on an  │
# │ always-on droplet under systemd (enabled + active, survives reboot). Not a laptop: a gate     │
# │ that depends on one developer's machine being awake is not a gate.                            │
# │                                                                                              │
# │ Proven red-then-green on THIS executor and image, on a branch:                                │
# │   RED   job 55744 — FAILED tests/test_planted_failure.py - assert 1 == 2                      │
# │   GREEN job 55750 — ruff · mypy · 160 passed · bandit · pip-audit → Job succeeded             │
# │   main  pipeline 16108 — success                                                              │
# │                                                                                              │
# │ An earlier proof ran on a SHELL executor, which silently ignores `image:` — so the declared   │
# │ environment was never exercised and the claim was broader than the evidence. Re-proving it    │
# │ here immediately caught a test that asserted `llm_share > 90`: true on the author's laptop,   │
# │ 89.4% in a container. That is the defect class a same-machine proof cannot find, and the      │
# │ whole reason this job runs somewhere else.                                                    │
# └──────────────────────────────────────────────────────────────────────────────────────────────┘
#
# The same gate as .githooks/pre-push, run on a runner instead of a laptop.
#
# The hook is the *primary* gate and stays that way — it is the one that has been watched blocking
# a planted failure (docs/GATE_LEDGER.md control 1), same as Weeks 1 and 2. This file would layer
# on top so the gate also runs on a machine that is not the author's, which is the only way it
# catches "works on mine" — an unpinned dependency, a test that passes only because a local .env
# exists, a file that was never committed.
#
# The middle one of those is already ruled out by hand: the suite was run with .env moved aside and
# an emptied environment, and all 122 tests passed. That is the check CI would have bought us
# soonest, so it was worth not waiting for a runner to find out.
#
# Nothing here needs a secret. The suite is hermetic by design (no network, no Bedrock, no live
# target: `pytest` is configured with `-m 'not live'`), which is verified by the absence of any
# variables block below — if a test ever needed a credential to pass, this job would fail and that
# would be the correct outcome, not something to paper over with a CI variable.

# RUN_CI=1 is set on the project, and was set only AFTER the API reported the runner online.
#
# That order is the whole lesson. Committing this file without the guard, with no runner attached,
# created a pipeline on every push that nothing could claim — six red pipelines, all meaningless.
# A reviewer sees red and reads "their tests are broken". The guard stays because it is what makes
# the file safe to carry while a runner is absent; it is not scaffolding to delete now that one
# exists.
workflow:
  rules:
    - if: $RUN_CI == "1"

default:
  image: python:3.12-slim
  interruptible: true
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .venv/
      - .cache/uv/

variables:
  UV_CACHE_DIR: .cache/uv
  # Fail on a lockfile that does not match pyproject.toml rather than silently resolving around it.
  UV_FROZEN: "1"

stages:
  - gate

gate:
  stage: gate
  before_script:
    # uv may already be present (a shell executor runs on a real machine, not a bare container),
    # and reinstalling it there would write into whatever Python happens to be on PATH.
    - command -v uv >/dev/null || pip install --quiet --no-cache-dir uv
    - uv sync --frozen
  script:
    # Same order as .githooks/pre-push, cheapest first, so a lint break fails in seconds.
    # (No banner echo here: an unquoted "a: b" inside a script item is parsed by YAML as a map,
    # not a string, which is exactly what silently invalidated this file's first version.)
    - uv run ruff check src tests
    - uv run mypy src
    - uv run pytest
    - uv run bandit -q -r src
    - uv run pip-audit
# No job-level `rules:` here, deliberately. This job carried
#   rules: [ if: $CI_COMMIT_BRANCH, if: $CI_MERGE_REQUEST_IID ]
# which is NARROWER than the workflow rule above, and that gap is a hole. A tag pipeline sets
# neither variable, so no job matched — and GitLab does not raise "no jobs", it declines to create
# the pipeline at all. Probed on tag `ci-probe-before`: zero pipelines, no error, no notification.
# Tagging a release would have run nothing while looking exactly like a repo with a green gate.
#
# Found by the sibling OpenEMR repo hitting the same class of bug from the other direction: there
# `golden-gate` was rule-restricted while `lint` and `security` were not, so a manually-triggered
# pipeline ran two of three jobs and reported success — a green badge with the test suite missing.
# Same root cause, opposite symptom, and neither was caught by the thing meant to catch it.
#
# The invariant, now that it is the only rule: if a pipeline exists at all, the gate runs in it.
# Coverage is decided in exactly one place (`workflow:` above), so there is no second place for the
# two to drift apart.
