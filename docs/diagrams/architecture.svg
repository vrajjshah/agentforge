<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.5,3 L0,6 z" fill="#334155"/>
    </marker>
    <marker id="arwL" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.5,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="620" fill="#ffffff"/>

  <text x="540" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">AgentForge — the multi-agent evaluation loop</text>
  <text x="540" y="52" text-anchor="middle" font-size="12" fill="#64748b">Distinct agents · distinct trust levels · distinct model families · deterministic-first</text>

  <!-- ============ Observability band (top infrastructure) ============ -->
  <rect x="40" y="68" width="1000" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="540" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">OBSERVABILITY  ·  Langfuse traces  +  self-contained dashboard</text>
  <text x="540" y="105" text-anchor="middle" font-size="11" fill="#64748b">every campaign is a trace with a span per agent hop — answers the six coverage / cost / resilience questions</text>

  <!-- ============ Feedback arc: Verdict → Orchestrator ============ -->
  <path d="M652,158 C520,120 300,120 158,158" fill="none" stroke="#334155" stroke-width="1.75" marker-end="url(#arw)"/>
  <rect x="288" y="129" width="234" height="16" fill="#ffffff"/>
  <text x="405" y="141" text-anchor="middle" font-size="11" fill="#334155">Verdict → coverage · cost · next campaign</text>

  <!-- ============ Agent row ============ -->
  <!-- Orchestrator -->
  <rect x="40" y="160" width="216" height="104" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="148" y="185" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4ed8">ORCHESTRATOR</text>
  <text x="148" y="205" text-anchor="middle" font-size="11.5" fill="#334155">strategy · Claude Sonnet-5 + rules</text>
  <text x="148" y="223" text-anchor="middle" font-size="10.5" fill="#475569">read-only · triggers regression · HALT</text>
  <text x="148" y="245" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">trust: cannot write findings</text>

  <!-- Red Team -->
  <rect x="296" y="160" width="216" height="104" rx="11" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="404" y="185" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b91c1c">RED TEAM</text>
  <text x="404" y="205" text-anchor="middle" font-size="11.5" fill="#334155">offense · Llama 4 Maverick</text>
  <text x="404" y="223" text-anchor="middle" font-size="10.5" fill="#475569">deterministic mutation (the bulk) + seeds</text>
  <text x="404" y="245" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">trust: may call target, can't self-judge</text>

  <!-- Judge -->
  <rect x="552" y="160" width="216" height="104" rx="11" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="660" y="185" text-anchor="middle" font-size="14.5" font-weight="700" fill="#15803d">JUDGE</text>
  <text x="660" y="205" text-anchor="middle" font-size="11.5" fill="#334155">evaluation · Claude Opus 4.8</text>
  <text x="660" y="223" text-anchor="middle" font-size="10.5" fill="#475569">tool-less · deterministic-first ladder</text>
  <text x="660" y="245" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">oracle = check-pack, not the attacker</text>

  <!-- Documentation -->
  <rect x="808" y="160" width="216" height="104" rx="11" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="916" y="185" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7e22ce">DOCUMENTATION</text>
  <text x="916" y="205" text-anchor="middle" font-size="11.5" fill="#334155">reporting · Claude Sonnet-5</text>
  <text x="916" y="223" text-anchor="middle" font-size="10.5" fill="#475569">the only writer to the vuln DB</text>
  <text x="916" y="245" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">human gate before a CRITICAL report</text>

  <!-- Horizontal message arrows between agents -->
  <line x1="256" y1="212" x2="294" y2="212" stroke="#334155" stroke-width="1.75" marker-end="url(#arw)"/>
  <text x="275" y="204" text-anchor="middle" font-size="10" fill="#334155">Campaign</text>

  <line x1="512" y1="212" x2="550" y2="212" stroke="#334155" stroke-width="1.75" marker-end="url(#arw)"/>
  <text x="531" y="204" text-anchor="middle" font-size="10" fill="#334155">Attempt</text>

  <line x1="768" y1="212" x2="806" y2="212" stroke="#334155" stroke-width="1.75" marker-end="url(#arw)"/>
  <text x="787" y="204" text-anchor="middle" font-size="10" fill="#334155">Verdict</text>

  <!-- Vertical arrows: agents → their store/target -->
  <!-- Orchestrator → Regression -->
  <line x1="148" y1="264" x2="148" y2="336" stroke="#334155" stroke-width="1.75" marker-end="url(#arw)"/>
  <text x="140" y="303" text-anchor="end" font-size="10" fill="#334155">trigger</text>
  <text x="140" y="316" text-anchor="end" font-size="10" fill="#64748b">on version change</text>

  <!-- Red Team → Live Target -->
  <line x1="404" y1="264" x2="404" y2="336" stroke="#334155" stroke-width="1.75" marker-end="url(#arw)"/>
  <text x="414" y="303" text-anchor="start" font-size="10" fill="#334155">HTTP via</text>
  <text x="414" y="316" text-anchor="start" font-size="10" fill="#64748b">TargetAdapter</text>

  <!-- Documentation → Vuln DB -->
  <line x1="916" y1="264" x2="916" y2="336" stroke="#334155" stroke-width="1.75" marker-end="url(#arw)"/>
  <text x="926" y="304" text-anchor="start" font-size="10" fill="#334155">VulnReport</text>

  <!-- ============ Sub-row: Regression · Live Target · Vuln DB ============ -->
  <!-- Regression -->
  <rect x="40" y="338" width="216" height="86" rx="11" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="148" y="365" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e7490">REGRESSION HARNESS</text>
  <text x="148" y="386" text-anchor="middle" font-size="10.5" fill="#475569">deterministic replay of confirmed exploits</text>
  <text x="148" y="403" text-anchor="middle" font-size="10.5" fill="#475569">asserts the security property, not a 200</text>

  <!-- Live Target (cylinder) -->
  <g>
    <path d="M296,352 h216 v58 a108,10 0 0 1 -216,0 v-58 z" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="404" cy="352" rx="108" ry="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="404" y="376" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">LIVE TARGET</text>
    <text x="404" y="395" text-anchor="middle" font-size="10.5" fill="#475569">Clinical Co-Pilot (deployed)</text>
    <text x="404" y="411" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">immutable allow-list</text>
  </g>

  <!-- Vuln DB -->
  <rect x="808" y="338" width="216" height="86" rx="11" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="916" y="365" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">VULN DB</text>
  <text x="916" y="386" text-anchor="middle" font-size="10.5" fill="#475569">versioned · data-quality gated</text>
  <text x="916" y="403" text-anchor="middle" font-size="10.5" fill="#475569">dual OWASP mapping required</text>

  <!-- Regression → Live Target (replay) -->
  <line x1="256" y1="381" x2="294" y2="381" stroke="#334155" stroke-width="1.75" marker-end="url(#arw)"/>
  <text x="275" y="373" text-anchor="middle" font-size="10" fill="#334155">replay</text>

  <!-- ============ Event Ledger band (bottom infrastructure) ============ -->
  <rect x="40" y="452" width="1000" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="540" y="476" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">EVENT LEDGER  ·  append-only substrate</text>
  <text x="540" y="494" text-anchor="middle" font-size="11" fill="#64748b">every agent appends only its own event type · the Orchestrator reads it as canonical input · PHI stays out</text>

  <text x="540" y="540" text-anchor="middle" font-size="11" fill="#64748b">All models run through Amazon Bedrock under one AWS BAA · the attacker (Llama 4 Maverick) was chosen by measured refusal behaviour, not vendor preference.</text>
</svg>
